name: build-mac

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Show toolchain
        run: |
          node --version
          npm --version
          sw_vers || true
          uname -a || true

      - name: Install deps (workspaces)
        # better-sqlite3 + @node-rs/jieba ship darwin-arm64 prebuilts via optionalDependencies;
        # no manual @electron/rebuild needed (both use N-API / napi-rs prebuilt).
        env:
          npm_config_fund: "false"
          npm_config_audit: "false"
        run: npm ci --include=optional

      - name: Build macOS dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          USE_HARD_LINKS: "false"
          NO_UPDATE_NOTIFIER: "1"
        run: |
          set -eo pipefail
          npx electron-builder --mac --arm64 --publish never 2>&1 | tail -120

      - name: List dist artifacts
        run: |
          ls -lh dist/ || true
          find dist -maxdepth 3 -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.app" -o -name "latest-mac.yml" -o -name "*.blockmap" \) | sort

      - name: Verify .app bundle contents
        run: |
          APP=$(find dist -maxdepth 2 -type d -name "*.app" | head -n 1)
          echo "App path: $APP"
          ls "$APP/Contents/Resources/" | head -n 30
          echo "--- browser-extension files ---"
          ls -la "$APP/Contents/Resources/browser-extension" 2>/dev/null || echo "MISSING"

      - name: Upload artifacts (dmg)
        uses: actions/upload-artifact@v5
        with:
          name: quickbrain-mac-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}