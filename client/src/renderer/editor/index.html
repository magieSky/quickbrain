<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">
  <title>速脑 · 笔记编辑</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0e1118; color: #e6e8ee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      font-size: 13px;
    }
    .editor-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .editor-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: #14181f;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex: 0 0 auto;
      -webkit-app-region: drag;
      user-select: none;
    }
    .editor-bar .title-input,
    .editor-bar .status,
    .editor-bar .lock-toggle,
    .editor-bar .save-btn,
    .editor-bar .win-ctrl,
    .editor-bar .win-ctrl-group { -webkit-app-region: no-drag; }
    .editor-bar .id-tag {
      font-size: 11px; color: rgba(255,255,255,0.35);
      padding: 2px 8px; border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .editor-bar .title-input {
      flex: 1; min-width: 0;
      background: transparent; border: none; outline: none;
      color: #fff; font-size: 14px; font-weight: 500;
      padding: 6px 4px;
    }
    .editor-bar .title-input::placeholder { color: rgba(255,255,255,0.3); }
    .editor-bar .lock-toggle {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; padding: 4px 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; color: rgba(255,255,255,0.7);
      cursor: pointer; user-select: none;
    }
    .editor-bar .lock-toggle.on { background: rgba(255,180,80,0.16); border-color: rgba(255,180,80,0.45); color: rgba(255,200,120,0.95); }
    .editor-bar .save-btn {
      padding: 6px 16px;
      background: linear-gradient(135deg, #5082ff 0%, #7c5cff 100%);
      color: #fff; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: filter 0.15s;
    }
    .editor-bar .save-btn:hover { filter: brightness(1.1); }
    .editor-bar .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .editor-bar .cancel-btn {
      padding: 6px 12px;
      background: transparent; color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
      font-size: 12px; cursor: pointer;
    }
    .editor-bar .cancel-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .editor-bar .win-ctrl-group { display: inline-flex; align-items: center; gap: 2px; margin-left: 4px; }
    .editor-bar .win-ctrl {
      width: 30px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: rgba(255,255,255,0.7);
      font-size: 13px; cursor: pointer; border-radius: 6px;
    }
    .editor-bar .win-ctrl:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .editor-bar .win-ctrl.win-close:hover { background: rgba(232,80,80,0.85); color: #fff; }
    .editor-bar .status {
      font-size: 11px; color: rgba(255,255,255,0.4);
      margin-right: 4px; min-width: 60px; text-align: right;
    }
    .editor-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
      padding: 6px 14px;
      background: #14181f;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex: 0 0 auto;
    }
    .editor-toolbar button {
      min-width: 30px; height: 28px;
      background: transparent; color: rgba(255,255,255,0.75);
      border: 1px solid transparent; border-radius: 5px;
      font-size: 12px; padding: 0 8px;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .editor-toolbar button:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .editor-toolbar button.active { background: rgba(124,158,255,0.18); color: #c0d2ff; border-color: rgba(124,158,255,0.35); }
    .editor-toolbar .sep { width: 1px; height: 18px; background: rgba(255,255,255,0.08); margin: 0 4px; }
    .editor-body { flex: 1; min-height: 0; overflow-y: auto; }
    .tt-content {
      max-width: 820px; margin: 0 auto;
      padding: 22px 36px 60px;
      outline: none;
      font-size: 14px; line-height: 1.7;
      color: #e6e8ee;
      min-height: 100%;
    }
    .tt-content p { margin: 0 0 12px; }
    .tt-content h1, .tt-content h2, .tt-content h3 {
      margin: 20px 0 12px; color: #fff; font-weight: 600;
      line-height: 1.3;
    }
    .tt-content h1 { font-size: 22px; }
    .tt-content h2 { font-size: 18px; }
    .tt-content h3 { font-size: 15px; }
    .tt-content ul, .tt-content ol { padding-left: 24px; margin: 0 0 12px; }
    .tt-content li { margin: 2px 0; }
    .tt-content blockquote {
      margin: 0 0 12px; padding: 6px 14px;
      border-left: 3px solid rgba(124,158,255,0.45);
      background: rgba(124,158,255,0.06);
      color: rgba(255,255,255,0.85);
      border-radius: 0 4px 4px 0;
    }
    .tt-content code {
      background: rgba(255,255,255,0.08);
      padding: 1px 5px; border-radius: 3px;
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, ui-monospace, monospace;
      font-size: 0.9em;
      color: #ffd9a8;
    }
    .tt-content pre.code-block {
      background: #161b24; color: #e6e8ee;
      padding: 12px 16px; border-radius: 6px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, ui-monospace, monospace;
      font-size: 12.5px; line-height: 1.55;
      margin: 0 0 12px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .tt-content pre.code-block code { background: transparent; padding: 0; color: inherit; }
    .tt-content a { color: #88a8ff; text-decoration: none; border-bottom: 1px solid rgba(136,168,255,0.35); }
    .tt-content a:hover { border-bottom-color: #88a8ff; }
    .tt-content hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0; }
    .tt-content strong { color: #fff; font-weight: 600; }
    .tt-content p.is-editor-empty:first-child::before {
      content: attr(data-placeholder);
      float: left; color: rgba(255,255,255,0.25);
      pointer-events: none; height: 0;
    }
    .editor-foot {
      flex: 0 0 auto;
      padding: 6px 14px;
      background: #14181f;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; gap: 16px;
      font-size: 11px; color: rgba(255,255,255,0.4);
    }
    .editor-foot .hint kbd {
      padding: 1px 5px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 3px; font-family: inherit;
      font-size: 10px;
    }
    .editor-foot .dirty { color: rgba(255,180,80,0.85); }
    .editor-foot .saved { color: rgba(94,234,212,0.85); }
  </style>
</head>
<body>
  <div class="editor-shell">
    <div class="editor-bar">
      <span class="id-tag" id="id-tag">#-</span>
      <input class="title-input" id="title" placeholder="标题（首行将作为笔记标题）" autocomplete="off">
      <span class="status" id="status">就绪</span>
      <button class="lock-toggle" id="lock-toggle" title="仅本机保存">🔒 仅本机</button>
      <button class="save-btn" id="save-btn">保存</button>
      <span class="win-ctrl-group">
        <button class="win-ctrl" id="win-min" title="最小化">—</button>
        <button class="win-ctrl" id="win-max" title="最大化">□</button>
        <button class="win-ctrl win-close" id="win-close" title="关闭">✕</button>
      </span>
    </div>
    <div class="editor-toolbar" id="toolbar">
      <button data-cmd="bold" title="粗体 (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
      <button data-cmd="strike" title="删除线"><s>S</s></button>
      <button data-cmd="code" title="行内代码"><span style="font-family:monospace">{}</span></button>
      <span class="sep"></span>
      <button data-cmd="h1" title="一级标题">H1</button>
      <button data-cmd="h2" title="二级标题">H2</button>
      <button data-cmd="h3" title="三级标题">H3</button>
      <span class="sep"></span>
      <button data-cmd="bulletList" title="无序列表">• 列表</button>
      <button data-cmd="orderedList" title="有序列表">1. 列表</button>
      <button data-cmd="blockquote" title="引用">❝ 引用</button>
      <button data-cmd="codeBlock" title="代码块">{ } 代码</button>
      <span class="sep"></span>
      <button data-cmd="link" title="链接">🔗</button>
      <button data-cmd="hr" title="分割线">―</button>
    </div>
    <div class="editor-body">
      <div id="content"></div>
    </div>
    <div class="editor-foot">
      <span class="hint"><kbd>Ctrl</kbd>+<kbd>S</kbd> 保存</span>
      <span class="hint"><kbd>Esc</kbd> 关闭</span>
      <span style="flex:1"></span>
      <span id="counter">0 字</span>
      <span id="dirty-flag"></span>
    </div>
  </div>
  <script src="editor.bundle.js"></script>
</body>
</html>
