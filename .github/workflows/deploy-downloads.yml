name: deploy-downloads

# Triggered after a successful build-desktop run, or manually.
# Pulls the freshly-built installers + latest*.yml + blockmaps and SCPs them
# into /var/www/quickbrain-website/downloads/desktop/ on the production server.
# nginx already serves /var/www/quickbrain-website as static files, so no
# nginx config change is required.
#
# Layout on the server (flat, all platforms in one dir):
#   /var/www/quickbrain-website/downloads/desktop/
#     QuickBrain-Setup-<ver>.exe          (Windows)
#     QuickBrain-Setup-<ver>.exe.blockmap
#     latest.yml
#     QuickBrain-<ver>-arm64.dmg         (macOS)
#     QuickBrain-<ver>-arm64.dmg.blockmap
#     QuickBrain-<ver>-x64.dmg
#     QuickBrain-<ver>-x64.dmg.blockmap
#     latest-mac.yml
#     QuickBrain-<ver>.AppImage          (Linux)
#     QuickBrain-<ver>.deb
#     latest-linux.yml
#     *.blockmap

on:
  workflow_run:
    workflows: ["build-desktop"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-downloads
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Resolve run id
        id: vars
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -n "$RUN_URL" ]; then
            echo "run_id=$(echo "$RUN_URL" | awk -F/ '{print $NF}')" >> "$GITHUB_OUTPUT"
            echo "Detected workflow_run id"
          else
            echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch - using current run id"
          fi

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.vars.outputs.run_id }}
        run: |
          set -e
          mkdir -p artifacts
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          echo "--- downloaded artifacts ---"
          find artifacts -maxdepth 3 -type f | sort

      - name: Stage downloads (flat - all platforms in one dir)
        run: |
          set -e
          mkdir -p staging

          # Windows
          if [ -d artifacts/quickbrain-windows ]; then
            cp -v artifacts/quickbrain-windows/*.exe      staging/ 2>/dev/null || true
            cp -v artifacts/quickbrain-windows/*.yml      staging/ 2>/dev/null || true
            cp -v artifacts/quickbrain-windows/*.blockmap staging/ 2>/dev/null || true
          fi

          # macOS (arm64 + x64)
          for plat in quickbrain-mac-arm64 quickbrain-mac-x64; do
            if [ -d "artifacts/$plat" ]; then
              cp -v "artifacts/$plat"/*.dmg       staging/ 2>/dev/null || true
              cp -v "artifacts/$plat"/*.zip       staging/ 2>/dev/null || true
              cp -v "artifacts/$plat"/*.yml       staging/ 2>/dev/null || true
              cp -v "artifacts/$plat"/*.blockmap  staging/ 2>/dev/null || true
            fi
          done

          # Linux
          if [ -d artifacts/quickbrain-linux ]; then
            cp -v artifacts/quickbrain-linux/*.AppImage staging/ 2>/dev/null || true
            cp -v artifacts/quickbrain-linux/*.deb      staging/ 2>/dev/null || true
            cp -v artifacts/quickbrain-linux/*.rpm      staging/ 2>/dev/null || true
            cp -v artifacts/quickbrain-linux/*.yml      staging/ 2>/dev/null || true
            cp -v artifacts/quickbrain-linux/*.blockmap staging/ 2>/dev/null || true
          fi

          echo "--- staged files ---"
          ls -lh staging/ || true

      - name: SCP to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "staging"
          target: "/var/www/quickbrain-website/downloads/desktop/"
          strip_components: 1

      - name: Cleanup old versions (keep newest 5 per extension)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            REMOTE=/var/www/quickbrain-website/downloads/desktop
            cd "$REMOTE"
            for ext in exe dmg AppImage deb rpm zip yml blockmap; do
              # Keep `latest.yml` / `latest-mac.yml` / `latest-linux.yml` forever
              # (electron-updater always reads these to discover new releases).
              ls -t *.$ext 2>/dev/null | grep -v '^latest' | tail -n +6 | xargs -r rm -f -- || true
            done
            echo "--- after cleanup ---"
            ls -lh "$REMOTE" | head -n 30

      - name: Smoke test
        run: |
          set -e
          for url in \
            https://note.bjhzsk.cn/downloads/desktop/latest.yml \
            https://note.bjhzsk.cn/downloads/desktop/latest-mac.yml \
            https://note.bjhzsk.cn/downloads/desktop/latest-linux.yml; do
            code=$(curl -fsSL -o /dev/null -w "%{http_code}" "$url" || echo "fail")
            echo "$url -> $code"
          done