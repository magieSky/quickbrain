<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>速脑 命令面板</title>
  <link rel="stylesheet" href="palette.css">
</head>
<body>
  <div id="app">
    <div class="search-row">
      <input id="search-input" type="text" placeholder="搜索或输入命令（? 触发 AI 搜索）" autocomplete="off" spellcheck="false" autofocus>
    </div>
    <div id="status-bar" class="status-bar">就绪</div>
    <div id="results" class="results">
      <div id="results-empty" class="empty">输入关键词开始搜索</div>
    </div>
    <div class="hint-bar">
      <span>↑↓ 选择</span>
      <span>Enter 复制</span>
      <span>Shift+Enter 详情</span>
      <span>Ctrl+Enter 主窗口</span>
      <span>Esc 关闭</span>
    </div>
  </div>
  <script src="commands/parser.js"></script>
  <script src="commands/registry.js"></script>
  <script src="palette.js"></script>
</body>
</html>
