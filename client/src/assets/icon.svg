<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#5082ff"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="0.5" stop-color="#ffd86b"/>
      <stop offset="1" stop-color="#ffa83a"/>
    </linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eaff"/>
    </linearGradient>
  </defs>

  <!-- rounded square background with subtle inner shadow ring -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- soft inner ring for depth (very subtle) -->
  <rect x="40" y="40" width="944" height="944" rx="190" ry="190" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- half-brain: an arc with internal folds. Centered around (512, 540), spans about 500px wide. -->
  <g transform="translate(512 540)">
    <!-- brain outer arc (left half) - a thick C shape opening to the right -->
    <path d="M 0 -240
             A 240 240 0 0 0 0 240
             A 240 240 0 0 0 0 -240 Z"
          fill="url(#brain)"/>
    <!-- inner curve to suggest the "split" between hemispheres -->
    <path d="M 0 -240
             C 80 -180 100 -120 90 -60
             C 80 0 90 60 100 120
             C 105 180 80 220 0 240"
          fill="none" stroke="#7c5cff" stroke-width="6" stroke-opacity="0.35"/>
    <!-- inner folds (concentric arcs) -->
    <path d="M -40 -200 C -10 -160 -10 -120 -30 -80" fill="none" stroke="#7c5cff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.30"/>
    <path d="M -80 -160 C -50 -120 -50 -80 -70 -40" fill="none" stroke="#7c5cff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.30"/>
    <path d="M -120 -100 C -90 -60 -90 -20 -110 20" fill="none" stroke="#7c5cff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.30"/>
    <path d="M -150 -20 C -120 20 -120 60 -140 100" fill="none" stroke="#7c5cff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.30"/>
    <path d="M -160 60 C -130 100 -130 140 -150 180" fill="none" stroke="#7c5cff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.30"/>

    <!-- a few "neurons" dots -->
    <circle cx="-60" cy="-220" r="10" fill="#7c5cff" fill-opacity="0.25"/>
    <circle cx="-180" cy="-60" r="10" fill="#7c5cff" fill-opacity="0.25"/>
    <circle cx="-200" cy="120" r="10" fill="#7c5cff" fill-opacity="0.25"/>
    <circle cx="-100" cy="220" r="10" fill="#7c5cff" fill-opacity="0.25"/>
  </g>

  <!-- lightning bolt over the brain, "fast thought" mark -->
  <g transform="translate(640 220)">
    <path d="M 0 0
             L -120 240
             L -20 240
             L -80 480
             L 120 200
             L 30 200
             L 100 0 Z"
          fill="url(#bolt)"
          stroke="#ffffff"
          stroke-width="10"
          stroke-linejoin="round"/>
  </g>
</svg>
