services:
  ollama:
    image: ollama/ollama:latest
    container_name: qb-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - qb-ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ollama >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G

  postgres:
    image: qb-pgvector:16
    container_name: qb-postgres
    environment:
      POSTGRES_USER: qb
      POSTGRES_PASSWORD: qb
      POSTGRES_DB: qb
    volumes:
      - qb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qb -d qb"]
      interval: 5s
      retries: 10
      timeout: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: qb-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - qb-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
      timeout: 3s
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: qb-server
    environment:
      MODE: ${QB_MODE:-byos}
      PORT: ${QB_PORT:-7421}
      DB_URL: postgres://qb:qb@postgres:5432/qb
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: bge-m3
      EMBED_DIMS: "1024"
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY required (32 bytes hex = 64 chars)}
      OWNER_TOKEN: ${OWNER_TOKEN:?OWNER_TOKEN required}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?ADMIN_BOOTSTRAP_TOKEN required}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:7421:7421"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qb-pgdata:
  qb-redis:
  qb-ollama:
