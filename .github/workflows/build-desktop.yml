name: build-desktop

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            artifact: quickbrain-mac-arm64
          - os: macos-latest
            arch: x64
            artifact: quickbrain-mac-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Show toolchain
        run: |
          node --version
          npm --version
          sw_vers || true
          uname -a || true

      - name: Install deps (workspaces)
        # better-sqlite3 + @node-rs/jieba ship per-arch darwin prebuilts via optionalDependencies.
        # We pin npm's arch/cpu so each matrix job installs the NATIVE binaries for its target
        # arch (x64 job pulls darwin-x64 prebuilts even though it runs on an Apple Silicon runner),
        # producing a working Intel app instead of one bundling arm64 .node files.
        env:
          npm_config_fund: "false"
          npm_config_audit: "false"
          npm_config_arch: ${{ matrix.arch }}
          npm_config_cpu: ${{ matrix.arch }}
          npm_config_os: darwin
        run: npm ci --include=optional

      - name: Build macOS dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          USE_HARD_LINKS: "false"
          NO_UPDATE_NOTIFIER: "1"
        run: |
          set -eo pipefail
          npx electron-builder --mac --${{ matrix.arch }} --publish never 2>&1 | tail -120

      - name: List dist artifacts
        run: |
          ls -lh dist/ || true
          find dist -maxdepth 3 -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.app" -o -name "latest-mac.yml" -o -name "*.blockmap" \) | sort

      - name: Verify .app bundle contents
        run: |
          APP=$(find dist -maxdepth 2 -type d -name "*.app" | head -n 1)
          echo "App path: $APP"
          ls "$APP/Contents/Resources/" | head -n 30
          echo "--- native modules (arch sanity) ---"
          file "$APP/Contents/Resources/node_modules/better-sqlite3/build/Release/better_sqlite3.node" 2>/dev/null || echo "better_sqlite3 not found"
          echo "--- browser-extension files ---"
          ls -la "$APP/Contents/Resources/browser-extension" 2>/dev/null || echo "MISSING"

      - name: Upload artifacts (dmg)
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap

      - name: Create GitHub Release (tag push only, arm64)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.arch == 'arm64'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Show toolchain
        run: |
          node --version
          npm --version
          uname -a || true

      - name: Install system deps for packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg

      - name: Install deps (workspaces)
        # On ubuntu-latest npm ci pulls linux native prebuilts (better-sqlite3, @node-rs/jieba).
        env:
          npm_config_fund: "false"
          npm_config_audit: "false"
        run: npm ci --include=optional

      - name: Build Linux packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          USE_HARD_LINKS: "false"
          NO_UPDATE_NOTIFIER: "1"
        run: |
          set -eo pipefail
          npx electron-builder --linux --publish never 2>&1 | tail -120

      - name: List dist artifacts
        run: |
          ls -lh dist/ || true
          find dist -maxdepth 3 -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.snap" -o -name "latest-linux.yml" -o -name "*.blockmap" \) | sort

      - name: Verify native modules (arch sanity)
        run: |
          AI=$(find dist -maxdepth 2 -type f -name "*.AppImage" | head -n 1)
          echo "AppImage: $AI"
          file "$AI" 2>/dev/null || true
          MOD=$(find dist -path "*better-sqlite3/build/Release/better_sqlite3.node" | head -n 1)
          echo "better_sqlite3.node: $MOD"
          file "$MOD" 2>/dev/null || echo "better_sqlite3.node not found"

      - name: Upload artifacts (linux)
        uses: actions/upload-artifact@v5
        with:
          name: quickbrain-linux
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml
            dist/*.blockmap

  build-extension:
    name: Build Browser Extension (zip)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from manifest
        id: ver
        run: |
          VER=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VER"

      - name: Zip extension (exclude .key.txt - it's a private RSA key)
        run: |
          cd extension
          zip -r "../quickbrain-extension-v${{ steps.ver.outputs.version }}.zip" . -x '.key.txt' '.key.txt/*'
          cd ..
          ls -lh "quickbrain-extension-v${{ steps.ver.outputs.version }}.zip"

      - name: Verify zip contents
        run: |
          VER=${{ steps.ver.outputs.version }}
          unzip -l "quickbrain-extension-v$VER.zip" | head -30
          # Sanity check: .key.txt must NOT be inside
          if unzip -l "quickbrain-extension-v$VER.zip" | grep -q '\.key\.txt'; then
            echo "ERROR: .key.txt leaked into the zip!"
            exit 1
          fi

      - name: Render website/index.html with extension version
        run: |
          cp website/index.html /tmp/index.html
          sed -i "s|__QB_EXT_VERSION__|${{ steps.ver.outputs.version }}|g" /tmp/index.html
          echo "--- rendered version markers ---"
          grep -o "v[0-9][0-9.]*[0-9]" /tmp/index.html | sort -u
          mkdir -p dist-website
          mv /tmp/index.html dist-website/index.html

      - name: Upload extension artifact
        uses: actions/upload-artifact@v5
        with:
          name: quickbrain-extension
          if-no-files-found: error
          retention-days: 30
          path: quickbrain-extension-v${{ steps.ver.outputs.version }}.zip

      - name: Upload rendered website artifact
        uses: actions/upload-artifact@v5
        with:
          name: quickbrain-website
          if-no-files-found: error
          retention-days: 30
          path: dist-website/index.html