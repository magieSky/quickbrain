server {
    listen 80;
    server_name embedding.bjhzsk.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name embedding.bjhzsk.cn;

    ssl_certificate     /etc/letsencrypt/live/embedding.bjhzsk.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/embedding.bjhzsk.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/embedding.bjhzsk.cn/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 4m;

    gzip on;
    gzip_types application/json;

    # Static API key check (defined in /etc/nginx/conf.d/embed-auth.conf)
    if ($qb_embed_auth_ok = 0) {
        return 403 '{"error":"unauthorized"}';
    }

    # Ollama runs on 127.0.0.1:11434, exposed only to host nginx
    location / {
        proxy_pass http://127.0.0.1:11434;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }
}
