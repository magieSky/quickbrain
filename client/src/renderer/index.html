<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBrain</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container" id="app">
    <!-- Title Bar -->
    <div class="title-bar">
      <div class="title-bar-text">⚡ QuickBrain</div>
      <button class="sync-btn" onclick="openSyncDialog()" title="Sync">sync</button>
      <button class="settings-btn" onclick="openSettings()" title="设置">⚙️</button>
      <div class="title-bar-controls">
        <button aria-label="Minimize" onclick="minimizeWindow()"></button>
        <button aria-label="Close" onclick="closeWindow()"></button>
      </div>
    </div>
    
    <!-- Search Section -->
    <div class="search-section">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索你的信息... (Ctrl+K)" onkeyup="handleSearch(event)">
        <button class="clear-btn" id="clearSearch" onclick="clearSearch()" style="display:none">✕</button>
      </div>
      <div class="filter-tags">
        <button class="filter-tag active" data-category="all" onclick="filterByCategory('all')">全部</button>
        <button class="filter-tag" data-category="工作" onclick="filterByCategory('工作')">工作</button>
        <button class="filter-tag" data-category="学习" onclick="filterByCategory('学习')">学习</button>
        <button class="filter-tag" data-category="生活" onclick="filterByCategory('生活')">生活</button>
        <button class="filter-tag" data-category="灵感" onclick="filterByCategory('灵感')">灵感</button>
      </div>
    </div>
    
    <!-- Quick Add Buttons -->
    <div class="quick-add">
      <button class="add-btn" onclick="showAddDialog()">
        <span class="add-icon">+</span>
        <span>快速添加</span>
        <kbd>Ctrl+Alt+N</kbd>
      </button>
      <button class="ai-btn" onclick="showFormatDialog()">
        <span class="ai-icon">✨</span>
        <span>AI格式化</span>
        <kbd>Ctrl+F</kbd>
      </button>
    </div>
    
    <!-- Notes List -->
    <div class="notes-list" id="notesList">
      <!-- Notes will be rendered here -->
    </div>
    
    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">📝</div>
      <p>还没有记录</p>
      <p class="hint">按 Ctrl+Alt+N 快速添加第一条</p>
    </div>
  </div>
  
  <!-- Add Note Dialog -->
  <div class="dialog-overlay" id="addDialog" style="display:none">
    <div class="dialog">
      <div class="dialog-header">
        <h3>📝 添加新笔记</h3>
        <button class="close-btn" onclick="closeAddDialog()">✕</button>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label>标题</label>
          <input type="text" id="noteTitle" placeholder="可选的标题...">
        </div>
        <div class="form-group">
          <label>内容 *</label>
          <textarea id="noteContent" rows="6" placeholder="粘贴或输入你的信息..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>分类</label>
            <select id="noteCategory">
              <option value="工作">工作</option>
              <option value="学习">学习</option>
              <option value="生活">生活</option>
              <option value="灵感">灵感</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>标签</label>
            <input type="text" id="noteTags" placeholder="用逗号分隔...">
          </div>
        </div>
      </div>
      <div class="dialog-footer">
        <button class="cancel-btn" onclick="closeAddDialog()">取消</button>
        <button class="save-btn" onclick="saveNote()">保存</button>
      </div>
    </div>
  </div>
  
  <!-- Format Dialog -->
  <div class="dialog-overlay" id="formatDialog" style="display:none">
    <div class="dialog">
      <div class="dialog-header">
        <h3>✨ AI格式化</h3>
        <button class="close-btn" onclick="closeFormatDialog()">✕</button>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label>选择要格式化的笔记</label>
          <select id="formatNoteSelect">
            <option value="">-- 请选择 --</option>
          </select>
        </div>
        <div class="form-group">
          <label>或者输入内容</label>
          <textarea id="formatContent" rows="4" placeholder="输入需要AI格式化的内容..."></textarea>
        </div>
        <div class="form-group">
          <label>格式化方式</label>
          <select id="formatStyle">
            <option value="summary">摘要整理</option>
            <option value="structured">结构化输出</option>
            <option value="tags">标签分类</option>
            <option value="mindmap">思维导图</option>
          </select>
        </div>
      </div>
      <div class="dialog-footer">
        <button class="cancel-btn" onclick="closeFormatDialog()">取消</button>
        <button class="format-btn" id="formatBtn" onclick="formatWithAI()">开始格式化</button>
      </div>
    </div>
  </div>
  
  <!-- Sync Settings Dialog -->
  <div class="dialog-overlay" id="syncDialog" style="display:none">
    <div class="dialog">
      <div class="dialog-header">
        <h3>Sync Settings</h3>
        <button class="close-btn" onclick="closeSyncDialog()">x</button>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label>Server URL</label>
          <input id="syncServerUrl" type="text" placeholder="http://localhost:7422">
        </div>
        <div class="form-group">
          <label>Device Token (HMAC shared secret)</label>
          <input id="syncToken" type="password" placeholder="leave blank to keep current">
        </div>
        <div class="form-group">
          <label>Device Name</label>
          <input id="syncDeviceName" type="text" placeholder="My PC">
        </div>
        <div class="form-group">
          <label>Status</label>
          <div id="syncStatus" class="info">Loading...</div>
        </div>
      </div>
      <div class="dialog-footer">
        <button class="cancel-btn" onclick="closeSyncDialog()">Close</button>
        <button class="sync-btn" onclick="pullNow()">Pull Now</button>
        <button class="sync-btn" onclick="pushLocal()">Push Outbox</button>
        <button class="sync-btn" onclick="pushAll()">Push All</button>
        <button class="sync-btn" id="syncSaveBtn" onclick="saveSyncConfig()">Save &amp; Enable</button>
        <button class="danger" onclick="disableSync()">Disable</button>
      </div>
    </div>
  </div>

  <!-- Settings Dialog -->
  <div class="dialog-overlay" id="settingsDialog" style="display:none">
    <div class="dialog">
      <div class="dialog-header">
        <h3>Settings</h3>
        <button class="close-btn" onclick="closeSettingsDialog()">x</button>
      </div>
      <div class="dialog-body">
        <div class="form-group">
          <label>AI Mode</label>
          <div style="display:flex; gap:16px; margin-top:6px;">
            <label style="flex-direction:row; align-items:center;"><input type="radio" name="aiMode" value="direct" id="setAiModeDirect"> Direct (local provider)</label>
            <label style="flex-direction:row; align-items:center;"><input type="radio" name="aiMode" value="server" id="setAiModeServer"> Server (sync server AI)</label>
          </div>
          <div id="setAiServerStatus" class="info"></div>
        </div>
        <div class="form-group">
          <label>AI Provider (Direct Mode)</label>
          <select id="setProvider" onchange="onProviderChange()"></select>
        </div>
        <div class="form-group">
          <label>Model</label>
          <select id="setModel"></select>
          <input id="setModelCustom" type="text" placeholder="custom model name" style="display:none; margin-top:6px;">
        </div>
        <div class="form-group">
          <label id="setApiKeyLabel">API Key</label>
          <input id="setApiKey" type="password" placeholder="leave blank to keep current">
        </div>
        <div class="form-group">
          <label>Base URL</label>
          <input id="setBaseUrl" type="text" placeholder="(use provider default)">
        </div>
        <div id="setProviderStatus" class="info"></div>
        <div class="form-group">
          <label><input type="checkbox" id="setAutoLaunch"> Start QuickBrain at login</label>
        </div>
      </div>
      <div class="dialog-footer">
        <button class="cancel-btn" onclick="closeSettingsDialog()">Close</button>
        <button class="sync-btn" onclick="testProvider()">Test Connection</button>
        <button class="sync-btn" onclick="saveSettings()">Save All</button>
      </div>
    </div>
  </div>


  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>
  
    <script src="prompt-helper.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
