server {
    listen 80;
    server_name note.bjhzsk.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name note.bjhzsk.cn;

    ssl_certificate     /etc/letsencrypt/live/note.bjhzsk.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/note.bjhzsk.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/note.bjhzsk.cn/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API v1 (new clean URL): /api/* -> /v1/* on backend
    location /api/ {
        # /api/v1/sync/health -> /v1/sync/health (strip /api/ prefix)
        proxy_pass http://127.0.0.1:7421/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Admin UI (backend serves /admin/)
    location /admin/ {
        proxy_pass http://127.0.0.1:7421/admin/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Legacy API (kept for backward compat with existing client sync code):
    # /v1/* still routes directly to backend
    location /v1/ {
        proxy_pass http://127.0.0.1:7421/v1/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Auto-update downloads: serve real files; 404 on missing (do NOT SPA-fallback).
    # electron-updater and human users both rely on getting an actual file or 404,
    # never an HTML page.
    location /downloads/ {
        alias /var/www/quickbrain-website/downloads/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }

    # Static website (default fallback)
    root /var/www/quickbrain-website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* .(svg|css|js|woff2?|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
