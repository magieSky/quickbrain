<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>QuickBrain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #1a1b2e 0%, #16213e 100%);
      color: #e8e8f0;
      font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* ====== 标题栏 ====== */
    .titlebar {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      -webkit-app-region: drag;
      user-select: none;
    }
    .titlebar .logo { font-size: 16px; margin-right: 8px; }
    .titlebar .title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.85); }
    .titlebar .stats { margin-left: auto; font-size: 11px; color: rgba(255,255,255,0.4); -webkit-app-region: no-drag; }
    /* ====== 搜索区 ====== */
    .search-wrap { padding: 16px; }
    .search {
      width: 100%;
      padding: 10px 14px 10px 36px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #e8e8f0;
      font-size: 13px;
      transition: all 0.15s;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
      background-repeat: no-repeat;
      background-position: 12px center;
    }
    .search:focus { outline: none; border-color: rgba(120, 150, 255, 0.4); background-color: rgba(0, 0, 0, 0.4); }
    .search::placeholder { color: rgba(255,255,255,0.35); }
    /* ====== 分类筛选 ====== */
    .filters { display: flex; gap: 6px; padding: 0 16px 12px; flex-wrap: wrap; }
    .filter-chip {
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-chip:hover { background: rgba(255, 255, 255, 0.1); }
    .filter-chip.active { background: rgba(120, 150, 255, 0.25); border-color: rgba(120, 150, 255, 0.5); color: #fff; }
    /* ====== 工具栏 ====== */
    .toolbar { display: flex; gap: 8px; padding: 0 16px 12px; }
    .btn {
      flex: 1;
      padding: 8px 12px;
      background: rgba(120, 150, 255, 0.15);
      border: 1px solid rgba(120, 150, 255, 0.25);
      border-radius: 6px;
      color: #cfd8ff;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: rgba(120, 150, 255, 0.3); border-color: rgba(120, 150, 255, 0.5); }
    .btn.primary { background: linear-gradient(135deg, #5082ff 0%, #7c5cff 100%); border-color: transparent; color: #fff; }
    .btn.primary:hover { filter: brightness(1.1); }
    /* ====== 笔记列表 ====== */
    .note-list { flex: 1; overflow-y: auto; padding: 0 16px 12px; }
    .note-list::-webkit-scrollbar { width: 6px; }
    .note-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    .note-card {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .note-card:hover { background: rgba(120, 150, 255, 0.1); border-color: rgba(120, 150, 255, 0.3); transform: translateX(2px); }
    .note-title { font-size: 13px; font-weight: 500; color: #fff; margin-bottom: 4px; }
    .note-content { font-size: 12px; color: rgba(255,255,255,0.55); line-height: 1.5; max-height: 40px; overflow: hidden; text-overflow: ellipsis; }
    .note-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 10px; color: rgba(255,255,255,0.4); }
    .note-meta .badge { padding: 2px 6px; background: rgba(120, 150, 255, 0.2); border-radius: 3px; color: #a8b8ff; }
    /* ====== 空状态 ====== */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
    }
    .empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
    .empty .hint { font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 8px; }
    .empty kbd { padding: 2px 6px; background: rgba(255,255,255,0.1); border-radius: 3px; font-family: ui-monospace; font-size: 10px; }
    /* ====== 状态栏 ====== */
    .statusbar {
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .statusbar .actions { display: flex; gap: 6px; -webkit-app-region: no-drag; }
    .icon-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="logo">⚡</span>
    <span class="title">QuickBrain</span>
    <span class="stats" id="stats">0 条笔记</span>
  </div>

  <div class="search-wrap">
    <input type="text" class="search" id="search-input" placeholder="搜索笔记内容... (Ctrl+K 唤起命令面板)">
  </div>

  <div class="filters" id="filters">
    <span class="filter-chip active" data-cat="all">全部</span>
    <span class="filter-chip" data-cat="工作">工作</span>
    <span class="filter-chip" data-cat="学习">学习</span>
    <span class="filter-chip" data-cat="生活">生活</span>
    <span class="filter-chip" data-cat="灵感">灵感</span>
    <span class="filter-chip" data-cat="其他">其他</span>
  </div>

  <div class="toolbar">
    <button class="btn primary" id="add-btn">+ 添加笔记</button>
    <button class="btn" id="ai-btn">✨ AI 格式化</button>
  </div>

  <div class="note-list" id="note-list">
    <div class="empty" id="empty-state">
      <div class="icon">📝</div>
      <div>还没有记录</div>
      <div class="hint">按 <kbd>Ctrl</kbd>+<kbd>A</kbd> 快速添加，或点击上方按钮</div>
    </div>
  </div>

  <div class="statusbar">
    <span id="status">就绪</span>
    <div class="actions">
      <button class="icon-btn" id="settings-btn" title="设置">⚙️</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
