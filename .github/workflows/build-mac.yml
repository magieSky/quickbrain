name: build-mac

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Show toolchain
        run: |
          node --version
          npm --version
          sw_vers || true
          uname -a || true

      - name: Install deps (workspaces)
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx --yes @electron/rebuild -f -w better-sqlite3 -w @node-rs/jieba

      - name: Build macOS dmg (arm64, unsigned dev)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          USE_HARD_LINKS: "false"
        run: npm run build:mac

      - name: List dist artifacts
        run: |
          ls -lh dist/ || true
          find dist -maxdepth 3 -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.app" -o -name "latest-mac.yml" -o -name "*.blockmap" \) | sort

      - name: Verify .app bundle contents
        run: |
          APP=$(find dist -maxdepth 2 -type d -name "*.app" | head -n 1)
          echo "App path: $APP"
          ls "$APP/Contents/Resources/" | head -n 30
          echo "--- browser-extension files ---"
          ls -la "$APP/Contents/Resources/browser-extension" 2>/dev/null || echo "MISSING"

      - name: Upload artifacts (dmg + zip + .app)
        uses: actions/upload-artifact@v4
        with:
          name: quickbrain-mac-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/mac-*/QuickBrain.app
            dist/mac/QuickBrain.app
            dist/latest-mac.yml
            dist/*.blockmap

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}